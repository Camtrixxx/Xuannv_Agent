<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>遥感报告助手 - 单屏聊天原型</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #eef4ff;
      --green: #16a34a;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 0%, rgba(37, 99, 235, 0.1), transparent 28%),
        radial-gradient(circle at 82% 8%, rgba(22, 163, 74, 0.08), transparent 30%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr);
      min-height: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
    }

    .status {
      display: flex;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .status a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    .status button {
      border: 0;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      font-weight: 700;
      padding: 0;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 16px;
      padding: 0 20px 0;
      overflow: hidden;
      transition: grid-template-columns 180ms ease;
    }

    .app.preview-open .workspace {
      grid-template-columns: 240px minmax(0, 1.18fr) minmax(360px, 0.82fr);
    }

    .history-sidebar {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .history-head {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .history-head strong {
      font-size: 15px;
    }

    .new-session {
      height: 38px;
      border: 1px solid #bdd2ff;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .session-list {
      min-height: 0;
      overflow-y: auto;
      display: grid;
      gap: 8px;
      align-content: start;
      padding-right: 2px;
    }

    .session-item {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--text);
      cursor: pointer;
      padding: 10px;
      display: grid;
      gap: 5px;
    }

    .session-item.active {
      border-color: #bdd2ff;
      background: #fff;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.12);
    }

    .session-item strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .session-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .session-empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      padding: 10px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.6);
    }

    .conversation-column {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .stage {
      min-height: 0;
      display: grid;
      justify-items: center;
      padding: 0;
      overflow: hidden;
    }

    .chat {
      width: min(900px, 100%);
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 16px;
      overflow: hidden;
    }

    .intro {
      text-align: center;
      padding-top: 4px;
    }

    .intro h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0;
    }

    .intro p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .memory-strip {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .memory-strip span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      background: rgba(255, 255, 255, 0.72);
    }

    .messages {
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 4px 2px 22px;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }

    .messages::-webkit-scrollbar {
      width: 10px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border: 3px solid transparent;
      border-radius: 999px;
      background-clip: content-box;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .msg {
      max-width: min(720px, 92%);
      border-radius: 18px;
      padding: 12px 14px;
      line-height: 1.6;
      font-size: 15px;
    }

    .msg.agent {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .msg.agent:has(.report-card) {
      width: min(820px, 100%);
      max-width: 100%;
      border-radius: 16px;
    }

    .msg.user {
      align-self: flex-end;
      color: #fff;
      background: var(--primary);
    }

    .report-card {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .report-card h2 {
      margin: 0;
      font-size: 18px;
    }

    .report-card p {
      margin: 0;
      color: #374151;
    }

    .report-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .report-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .report-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    .intent-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .intent-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      background: #f8fafc;
    }

    .annotation-card {
      border: 1px solid #f2e3cb;
      background: linear-gradient(180deg, #fffdfa 0%, #fff8ef 100%);
      border-radius: 14px;
      padding: 15px 17px;
      display: grid;
      gap: 11px;
      width: 100%;
      box-shadow: 0 1px 3px rgba(180, 130, 40, 0.06);
    }

    .annotation-card .anno-head {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 650;
      font-size: 14.5px;
      color: #92400e;
      letter-spacing: 0.2px;
    }

    .annotation-card .anno-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #fdefdb;
      font-size: 14px;
      flex-shrink: 0;
    }

    .annotation-card p {
      margin: 0;
      color: #5b6472;
      font-size: 13px;
      line-height: 1.65;
    }

    .anno-cta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      align-self: start;
      background: #b45309;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 12.5px;
      padding: 6px 13px;
      border-radius: 999px;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .anno-cta:hover { background: #9a4708; }
    .anno-cta .anno-arrow { transition: transform 0.15s ease; }
    .anno-cta:hover .anno-arrow { transform: translateX(2px); }
    .anno-hint { font-size: 12px; color: var(--muted); }

    .report-figure {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    .report-figure img {
      display: block;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
    }

    .report-figure figcaption {
      padding: 8px 10px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px;
      background: #fbfcfe;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 15px;
    }

    .composer-wrap {
      display: grid;
      place-items: center;
      padding: 0 0 max(20px, env(safe-area-inset-bottom));
      min-height: 0;
    }

    .composer {
      width: min(900px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      gap: 10px;
      max-height: min(34vh, 220px);
      overflow: auto;
    }

    .preview-pane {
      min-width: 0;
      min-height: 0;
      display: none;
      grid-template-rows: 54px minmax(0, 1fr);
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px 16px 0 0;
      box-shadow: var(--shadow);
    }

    .app.preview-open .preview-pane {
      display: grid;
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px 0 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .preview-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .preview-title strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
    }

    .preview-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .preview-actions a,
    .preview-actions button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      place-items: center;
      padding: 0 12px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .preview-actions a:hover,
    .preview-actions button:hover {
      background: #eef2f7;
      border-color: #cbd5e1;
    }

    .preview-toggle {
      min-width: 84px;
      color: var(--primary);
    }

    .preview-close {
      width: 34px;
      padding: 0;
      color: #374151;
      font-size: 18px;
      line-height: 1;
    }

    .preview-body {
      min-height: 0;
      overflow: hidden;
      background: #f8fafc;
    }

    .preview-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .markdown-preview {
      height: 100%;
      overflow: auto;
      padding: 22px;
      background: #fff;
      line-height: 1.8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    .markdown-preview.raw {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }

    .markdown-preview h1,
    .markdown-preview h2,
    .markdown-preview h3 {
      margin: 18px 0 10px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .markdown-preview h1 {
      font-size: 25px;
    }

    .markdown-preview h2 {
      font-size: 20px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .markdown-preview h3 {
      font-size: 16px;
    }

    .markdown-preview p {
      margin: 8px 0;
    }

    .markdown-preview ul {
      margin: 8px 0;
      padding-left: 22px;
    }

    .markdown-preview li {
      margin: 5px 0;
    }

    .markdown-preview img {
      display: block;
      max-width: 100%;
      max-height: 360px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 10px 0;
      background: #fff;
    }

    .markdown-preview pre {
      overflow: auto;
      background: #0f172a;
      color: #e5e7eb;
      border-radius: 8px;
      padding: 12px;
    }

    .markdown-preview code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .preview-empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .task-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag,
    .map-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: #374151;
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tag.active {
      color: var(--primary);
      border-color: #bdd2ff;
      background: var(--primary-soft);
      font-weight: 700;
    }

    .tag:disabled {
      cursor: not-allowed;
      color: #94a3b8;
      background: #f8fafc;
    }

    .map-btn {
      border-radius: 12px;
      color: var(--green);
      border-color: #bbf7d0;
      background: #f0fdf4;
      font-weight: 700;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 44px;
      gap: 10px;
      align-items: center;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 2px;
    }

    .suggestion {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff;
      color: #4b5563;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.25;
    }

    .input-row input {
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: 0;
      padding: 0 14px;
      background: #fbfcfe;
      font-size: 15px;
    }

    .send {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      font-weight: 800;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.28);
      z-index: 10;
    }

    .modal-backdrop.show {
      display: grid;
    }

    .modal {
      width: min(1080px, 100%);
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .modal-head {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head strong {
      font-size: 16px;
    }

    .close {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.9fr);
      gap: 14px;
    }

    .map {
      min-height: 430px;
      border: 1px solid var(--line);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      background: #dbe6de;
    }

    #leafletMap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }


    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-container {
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .leaflet-container img.leaflet-tile {
      max-width: none !important;
      max-height: none !important;
      width: 256px;
      height: 256px;
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      background: #dbe6de;
    }

    .leaflet-tile {
      visibility: hidden;
      user-select: none;
      -webkit-user-drag: none;
    }

    .leaflet-tile-loaded {
      visibility: inherit;
    }

    .leaflet-pane {
      z-index: 400;
    }

    .leaflet-tile-pane {
      z-index: 200;
    }

    .leaflet-overlay-pane {
      z-index: 400;
    }

    .leaflet-marker-pane {
      z-index: 600;
    }

    .leaflet-tooltip-pane {
      z-index: 650;
    }

    .leaflet-popup-pane {
      z-index: 700;
    }

    .leaflet-control {
      position: relative;
      z-index: 800;
      pointer-events: auto;
    }

    .leaflet-top,
    .leaflet-bottom {
      position: absolute;
      z-index: 1000;
      pointer-events: none;
    }

    .leaflet-top {
      top: 0;
    }

    .leaflet-right {
      right: 0;
    }

    .leaflet-bottom {
      bottom: 0;
    }

    .leaflet-left {
      left: 0;
    }

    .leaflet-control {
      float: left;
      clear: both;
      margin: 10px;
    }

    .leaflet-right .leaflet-control {
      float: right;
    }

    .leaflet-control-zoom a {
      display: block;
      width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      background: #fff;
      color: #1f2937;
      border-bottom: 1px solid #d1d5db;
      text-decoration: none;
      font-weight: 800;
    }

    .leaflet-control-zoom a:first-child {
      border-radius: 6px 6px 0 0;
    }

    .leaflet-control-zoom a:last-child {
      border-bottom: 0;
      border-radius: 0 0 6px 6px;
    }

    .leaflet-control-zoom {
      margin-top: 70px !important;
    }

    .map-tools {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, max-content));
      gap: 8px;
      align-items: start;
      justify-content: start;
      pointer-events: none;
    }

    .map-tools button {
      pointer-events: auto;
    }

    .map-tools button {
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #fff;
      color: #1f2937;
      border-radius: 10px;
      padding: 7px 10px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    .patch-list {
      display: grid;
      gap: 8px;
      max-height: 236px;
      overflow: auto;
      padding-right: 2px;
    }

    .patch-item {
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
    }

    .patch-item.active {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .patch-item strong {
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .patch-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .map-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .map-confirm {
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 800;
    }

    .map-confirm:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .regions {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .region {
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 13px;
      cursor: pointer;
    }

    .region.active {
      border-color: #bdd2ff;
      background: var(--primary-soft);
    }

    .region strong {
      display: block;
      margin-bottom: 4px;
    }

    .region span {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 720px) {
      .app {
        grid-template-rows: 56px minmax(0, 1fr);
      }

      .workspace,
      .app.preview-open .workspace {
        grid-template-columns: 1fr;
      }

      .history-sidebar {
        display: none;
      }

      .app.preview-open .conversation-column {
        display: none;
      }

      .topbar {
        padding: 0 16px;
      }

      .status {
        display: none;
      }

      .intro h1 {
        font-size: 24px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .modal-body {
        grid-template-columns: 1fr;
      }

      .map {
        min-height: 220px;
      }

      .map-tools {
        grid-template-columns: repeat(2, minmax(0, max-content));
      }

      .leaflet-control-zoom {
        margin-top: 106px !important;
      }

      .report-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .msg {
        max-width: 96%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">遥感报告助手</div>
      <div class="status">
        <span>玄女底座模型</span>
        <a href="/workflow" target="_blank" rel="noreferrer">工作原理</a>
        <button id="resetSession" type="button">清空会话</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="history-sidebar" aria-label="历史会话">
        <div class="history-head">
          <strong>历史会话</strong>
          <button class="new-session" id="newSession" type="button">新建会话</button>
        </div>
        <div class="session-list" id="sessionList">
          <div class="session-empty">暂无历史会话。</div>
        </div>
      </aside>

      <div class="conversation-column">
        <main class="stage">
          <section class="chat">
            <div class="intro">
              <h1>一句话生成遥感分析报告</h1>
              <p>直接用自然语言说出你的需求即可；想生成报告时，也可以顺手选择任务标签和地图区域。</p>
              <div class="memory-strip" id="memoryStrip">
                <span>会话：新建</span>
                <span>状态：等待输入</span>
              </div>
            </div>

            <div class="messages" id="messages">
              <div class="msg agent">你好，我是遥感报告助手 👋 直接告诉我你想分析什么就行，比如“雅江区域去年九月的水体分布”。也可以先问我能做什么。</div>
            </div>
          </section>
        </main>

        <footer class="composer-wrap">
          <section class="composer">
            <div class="toolbar">
              <div class="task-tags" id="taskTags"></div>
              <button class="map-btn" id="openMap">选择地图：雅江区域</button>
            </div>
            <div class="input-row">
              <input id="prompt" value="给我一份去年九月份的分析报告" aria-label="输入分析任务" />
              <button class="send" id="send">→</button>
            </div>
            <div class="suggestions">
              <button class="suggestion" data-prompt="给我一份分析报告">缺月份示例</button>
              <button class="suggestion" data-prompt="去年十月份">补充月份</button>
              <button class="suggestion" data-prompt="哈尔滨新区去年九月份土地利用分类报告">哈尔滨示例</button>
              <button class="suggestion" data-prompt="北京市海淀区2025年12月建筑物提取报告">海淀示例</button>
              <button class="suggestion" data-prompt="你能做什么？">普通对话</button>
            </div>
          </section>
        </footer>
      </div>

      <aside class="preview-pane" id="previewPane" aria-label="报告预览">
        <div class="preview-head">
          <div class="preview-title">
            <strong id="previewTitle">报告预览</strong>
            <span id="previewMeta">HTML / Markdown</span>
          </div>
          <div class="preview-actions">
            <a id="previewOpenRaw" href="#" target="_blank" rel="noreferrer">新标签</a>
            <button class="preview-toggle" id="toggleMarkdownRaw" type="button">原文</button>
            <button class="preview-close" id="closePreview" type="button" aria-label="关闭预览">×</button>
          </div>
        </div>
        <div class="preview-body" id="previewBody">
          <div class="preview-empty">点击报告链接后在这里查看内容。</div>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal-backdrop" id="mapModal">
    <div class="modal">
      <div class="modal-head">
        <strong>选择地图区域</strong>
        <button class="close" id="closeMap">×</button>
      </div>
      <div class="modal-body">
        <div class="map">
          <div id="leafletMap"></div>
          <div class="map-tools">
            <button id="startMapSelect" type="button">框选区域</button>
            <button id="toggleBaseLayer" type="button">卫星图层</button>
          </div>
        </div>
        <div class="regions">
          <button class="region active" data-region="雅江区域">
            <strong>雅江区域</strong>
            <span>山地、河谷、林草地、水体</span>
          </button>
          <button class="region" data-region="哈尔滨新区">
            <strong>哈尔滨新区</strong>
            <span>城市、耕地、松花江水系</span>
          </button>
          <button class="region" data-region="北京市海淀区">
            <strong>北京市海淀区</strong>
            <span>城市建设区、公园绿地、水体</span>
          </button>
          <div class="map-note" id="patchStatus"></div>
          <div class="patch-list" id="patchList"></div>
          <button class="map-confirm" id="confirmPatchSelection" type="button" disabled>使用选中 Patch</button>
        </div>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>
  <script>
    let currentTask = "";
    let currentRegion = "雅江区域";
    let sessionId = (() => {
      const existing = localStorage.getItem("yajiang_agent_session_id");
      if (existing) return existing;
      const created = `session_${Date.now()}_${Math.random().toString(16).slice(2)}`;
      localStorage.setItem("yajiang_agent_session_id", created);
      return created;
    })();

    const regionData = {
      "雅江区域": {
        main: "林地/草地",
        center: [29.601479, 95.301624],
        zoom: 10,
        defaultBbox: [95.039912, 29.341305, 95.563335, 29.861653],
        tasks: ["地物分类", "水体分布", "高程地形"],
        summary: "区域内 patch 数据位于雅江原始遥感数据覆盖范围内，支持地图框选后定位到本地 AEF 样本 patch。"
      },
      "哈尔滨新区": {
        main: "耕地/水体",
        center: [45.752, 126.548],
        zoom: 13,
        defaultBbox: [126.5, 45.74, 126.57, 45.765],
        tasks: ["建筑物提取", "土地利用分类", "水体提取"],
        summary: "区域内耕地和建设用地分布明显，水体沿松花江及支流展开，适合用于城市周边地表覆盖和水体格局研判。"
      },
      "北京市海淀区": {
        main: "建设用地",
        center: [39.895, 116.27],
        zoom: 13,
        defaultBbox: [116.24, 39.88, 116.29, 39.90],
        tasks: ["建筑物提取", "道路提取", "施工识别", "土地利用分类", "土地覆盖分类", "水体提取"],
        summary: "区域内建设用地占比较高，绿地主要分布在西部山前地带和公园片区，适合用于城市专题要素提取和变化研判。"
      }
    };
    const patchSearchRegions = new Set(["雅江区域", "哈尔滨新区", "北京市海淀区"]);

    const messages = document.getElementById("messages");
    const taskTags = document.getElementById("taskTags");
    const sessionList = document.getElementById("sessionList");
    const mapModal = document.getElementById("mapModal");
    const openMap = document.getElementById("openMap");
    const app = document.querySelector(".app");
    const patchStatus = document.getElementById("patchStatus");
    const patchList = document.getElementById("patchList");
    const confirmPatchSelection = document.getElementById("confirmPatchSelection");
    const previewTitle = document.getElementById("previewTitle");
    const previewMeta = document.getElementById("previewMeta");
    const previewBody = document.getElementById("previewBody");
    const previewOpenRaw = document.getElementById("previewOpenRaw");
    const toggleMarkdownRaw = document.getElementById("toggleMarkdownRaw");
    let currentMarkdownPreview = null;
    let leafletMap = null;
    let selectingMap = false;
    let selectStartLatLng = null;
    let selectedAoi = null;
    let selectedPatchIds = [];
    const maxPatchSelection = 8;
    let selectedPatchRegion = "";
    let candidatePatches = [];
    let patchSearchController = null;
    let patchSearchRequestId = 0;
    let selectionLayer = null;
    let patchLayers = [];
    let mapResizeObserver = null;
    let baseLayers = {};
    let activeBaseLayer = "standard";

    function addMessage(html, type) {
      const node = document.createElement("div");
      node.className = `msg ${type}`;
      node.innerHTML = html;
      messages.appendChild(node);
      messages.scrollTop = messages.scrollHeight;
    }

    function createSessionId() {
      return `session_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    function setSessionId(nextSessionId) {
      sessionId = nextSessionId;
      localStorage.setItem("yajiang_agent_session_id", sessionId);
    }

    function renderInitialMessage(text = "你好，我是遥感报告助手 👋 直接告诉我你想分析什么就行，比如“雅江区域去年九月的水体分布”。也可以先问我能做什么。") {
      messages.innerHTML = `<div class="msg agent">${escapeHtml(text)}</div>`;
    }

    function getRegionTasks(region) {
      return (regionData[region] && regionData[region].tasks) || [];
    }

    function renderTaskTags(preferredTask = "") {
      const tasks = getRegionTasks(currentRegion);
      if (!tasks.length) {
        currentTask = "";
        taskTags.innerHTML = '<button class="tag" type="button" disabled>专题任务待接入</button>';
        return;
      }
      // Never auto-select a task: keep it empty until the user picks or names one.
      currentTask = tasks.includes(preferredTask) ? preferredTask : (tasks.includes(currentTask) ? currentTask : "");
      taskTags.innerHTML = tasks.map((task) => `
        <button class="tag ${task === currentTask ? "active" : ""}" data-task="${escapeHtml(task)}" type="button">${escapeHtml(task)}</button>
      `).join("");
    }

    function formatSessionTime(value) {
      if (!value) {
        return "";
      }
      const normalized = value.replace("Z", "");
      const parts = normalized.split("T");
      if (parts.length < 2) {
        return value;
      }
      return `${parts[0]} ${parts[1].slice(0, 5)}`;
    }

    function renderSessionList(sessions) {
      if (!sessions.length) {
        sessionList.innerHTML = '<div class="session-empty">暂无历史会话。</div>';
        return;
      }
      sessionList.innerHTML = sessions.map((session) => `
        <button class="session-item ${session.session_id === sessionId ? "active" : ""}" data-session-id="${escapeHtml(session.session_id)}" type="button">
          <strong>${escapeHtml(session.title || "新会话")}</strong>
          <span>${escapeHtml(session.summary || session.last_user_message || "等待输入")}</span>
          <span>${escapeHtml(formatSessionTime(session.updated_at))}</span>
        </button>
      `).join("");
    }

    async function refreshSessions() {
      try {
        const response = await fetch("/api/sessions?limit=40");
        const payload = await response.json();
        renderSessionList(payload.sessions || []);
      } catch (error) {
        sessionList.innerHTML = '<div class="session-empty">历史会话加载失败。</div>';
      }
    }

    function messageToHtml(message) {
      if (message.role === "user") {
        return `<div class="msg user">${escapeHtml(message.content)}</div>`;
      }
      return `<div class="msg agent">${escapeHtml(message.content || "我在。")}</div>`;
    }

    function renderHistoryReportCard(report) {
      const request = report.request || {};
      const title = report.title || "历史报告";
      return `
        <div class="msg agent">
          <div class="report-card">
            <h2>${escapeHtml(title)}</h2>
            <div class="intent-row">
              <span class="intent-pill">任务：${escapeHtml(request.task || "未知")}</span>
              <span class="intent-pill">地区：${escapeHtml(request.region || "未知")}</span>
              <span class="intent-pill">时间：${escapeHtml(request.time_range || "未知")}</span>
              <span class="intent-pill">来源：历史会话</span>
            </div>
            <p>这份报告来自当前历史会话，可以在右侧预览完整内容。</p>
            <div class="report-links">
              <a href="${escapeHtml(report.html_url)}" data-preview-url="${escapeHtml(report.html_url)}" data-preview-type="html" data-preview-title="${escapeHtml(title)}">打开完整 HTML 报告</a>
              <a href="${escapeHtml(report.markdown_url)}" data-preview-url="${escapeHtml(report.markdown_url)}" data-preview-type="markdown" data-preview-title="${escapeHtml(title)}">查看 Markdown</a>
            </div>
          </div>
        </div>
      `;
    }

    function eventTime(value) {
      if (!value) {
        return 0;
      }
      const parsed = Date.parse(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function dedupeReports(reports) {
      const seen = new Set();
      return reports.filter((report) => {
        const key = `${report.html_url || ""}|${report.markdown_url || ""}|${report.created_at || ""}`;
        if (seen.has(key)) {
          return false;
        }
        seen.add(key);
        return true;
      });
    }

    function restoreMessages(memory) {
      const recent = memory.recent_messages || [];
      const reports = dedupeReports(memory.reports || []);
      if (!recent.length) {
        messages.innerHTML = reports.length
          ? reports.map(renderHistoryReportCard).join("")
          : '<div class="msg agent">已切换到这个会话，可以继续输入需求。</div>';
        messages.scrollTop = messages.scrollHeight;
        return;
      }
      const events = recent.map((message, index) => ({
        type: "message",
        time: eventTime(message.created_at),
        index,
        message
      }));
      const reportEvents = reports.map((report, index) => ({
        type: "report",
        time: eventTime(report.created_at),
        index,
        report
      }));
      const insertedReports = new Set();

      reportEvents.forEach((reportEvent) => {
        let targetIndex = -1;
        let targetDistance = Number.POSITIVE_INFINITY;
        events.forEach((event, eventIndex) => {
          if (event.type !== "message" || event.message.role !== "assistant") {
            return;
          }
          if (!String(event.message.content || "").includes("报告已生成")) {
            return;
          }
          const distance = Math.abs(event.time - reportEvent.time);
          if (distance < targetDistance) {
            targetDistance = distance;
            targetIndex = eventIndex;
          }
        });
        if (targetIndex >= 0) {
          events.splice(targetIndex + 1, 0, reportEvent);
          insertedReports.add(reportEvent.index);
        }
      });

      reportEvents.forEach((reportEvent) => {
        if (!insertedReports.has(reportEvent.index)) {
          events.push(reportEvent);
        }
      });

      messages.innerHTML = events.map((event) => (
        event.type === "message" ? messageToHtml(event.message) : renderHistoryReportCard(event.report)
      )).join("");
      messages.scrollTop = messages.scrollHeight;
    }

    async function loadSession(nextSessionId) {
      try {
        const response = await fetch(`/api/session/${encodeURIComponent(nextSessionId)}`);
        const payload = await response.json();
        if (!response.ok || payload.status !== "ok") {
          throw new Error(payload.detail || "会话加载失败");
        }
        setSessionId(nextSessionId);
        closePreview();
        restoreMessages(payload.memory || {});
        updateMemoryStrip({
          status: payload.session?.mode || "idle",
          session_id: sessionId,
          memory: payload.memory || {},
          intent: payload.session?.current_intent || {}
        });
        const intent = payload.session?.current_intent || {};
        if (intent.region && regionData[intent.region]) {
          currentRegion = intent.region;
          document.querySelectorAll(".region").forEach((item) => item.classList.toggle("active", item.dataset.region === currentRegion));
        }
        renderTaskTags(intent.task || currentTask);
        updateMapLabel();
        await refreshSessions();
      } catch (error) {
        addMessage(`<p>会话加载失败：${escapeHtml(error.message || "未知错误")}</p>`, "agent");
      }
    }

    async function newSession() {
      setSessionId(createSessionId());
      closePreview();
      renderInitialMessage("新会话已创建。直接说出你想分析什么就行，比如“哈尔滨新区上个月的建筑物提取”。");
      updateMemoryStrip({status: "idle", session_id: sessionId, memory: {pending_slots: [], reports: []}});
      await refreshSessions();
      document.getElementById("prompt").focus();
    }

    function updateMapLabel() {
      const patchText = selectedPatchIds.length === 1
        ? ` · ${selectedPatchIds[0]}`
        : (selectedPatchIds.length > 1 ? ` · ${selectedPatchIds.length} 个 patch` : "");
      openMap.textContent = `选择地图：${currentRegion}${patchText}`;
      const data = regionData[currentRegion] || regionData["雅江区域"];
      if (leafletMap) {
        leafletMap.setView(data.center, data.zoom, {animate: false});
        refreshLeafletMap();
      }
      if (!patchSearchRegions.has(currentRegion)) {
        clearPatchSelection();
        patchStatus.textContent = "当前区域暂不支持地图定位 patch。";
      }
    }

    function clearPatchSelection() {
      selectedAoi = null;
      selectedPatchIds = [];
      selectedPatchRegion = "";
      candidatePatches = [];
      patchList.innerHTML = "";
      confirmPatchSelection.disabled = true;
      patchStatus.textContent = patchSearchRegions.has(currentRegion)
        ? ""
        : "当前区域暂不支持地图定位 patch。";
      patchLayers.forEach((layer) => layer.remove());
      patchLayers = [];
      if (selectionLayer) {
        selectionLayer.remove();
        selectionLayer = null;
      }
    }

    function initLeafletMap() {
      if (leafletMap || !window.L) {
        if (leafletMap) {
          refreshLeafletMap();
        }
        return;
      }
      const data = regionData[currentRegion] || regionData["雅江区域"];
      leafletMap = L.map("leafletMap", {zoomControl: true}).setView(data.center, data.zoom);
      baseLayers.standard = L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
        subdomains: ["1", "2", "3", "4"],
        maxZoom: 18,
        attribution: "&copy; 高德地图"
      });
      baseLayers.satellite = L.tileLayer("https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", {
        subdomains: ["1", "2", "3", "4"],
        maxZoom: 18,
        attribution: "&copy; 高德卫星"
      });
      Object.values(baseLayers).forEach((layer) => {
        layer.on("tileerror", () => {
          patchStatus.textContent = "底图瓦片加载不稳定时，patch 边界仍可正常框选和检索。";
        });
      });
      baseLayers.standard.addTo(leafletMap);

      L.control.layers(
        {"标准地图": baseLayers.standard, "卫星影像": baseLayers.satellite},
        {},
        {position: "bottomleft", collapsed: true}
      ).addTo(leafletMap);

      if (window.ResizeObserver && !mapResizeObserver) {
        mapResizeObserver = new ResizeObserver(() => refreshLeafletMap());
        mapResizeObserver.observe(document.querySelector(".map"));
      }

      leafletMap.on("mousedown", (event) => {
        if (!selectingMap) {
          return;
        }
        selectStartLatLng = event.latlng;
        leafletMap.dragging.disable();
        if (selectionLayer) {
          selectionLayer.remove();
        }
        selectionLayer = L.rectangle([event.latlng, event.latlng], {
          color: "#2563eb",
          weight: 2,
          fillColor: "#2563eb",
          fillOpacity: 0.12
        }).addTo(leafletMap);
      });

      leafletMap.on("mousemove", (event) => {
        if (!selectingMap || !selectStartLatLng || !selectionLayer) {
          return;
        }
        selectionLayer.setBounds(L.latLngBounds(selectStartLatLng, event.latlng));
      });

      leafletMap.on("mouseup", async (event) => {
        if (!selectingMap || !selectStartLatLng || !selectionLayer) {
          return;
        }
        selectionLayer.setBounds(L.latLngBounds(selectStartLatLng, event.latlng));
        const bounds = selectionLayer.getBounds();
        selectedAoi = {
          type: "bbox",
          coordinates: [
            bounds.getWest(),
            bounds.getSouth(),
            bounds.getEast(),
            bounds.getNorth()
          ]
        };
        selectingMap = false;
        selectStartLatLng = null;
        leafletMap.dragging.enable();
        await searchPatches(selectedAoi.coordinates);
      });

      refreshLeafletMap();
    }

    function toggleBaseLayer() {
      if (!leafletMap || !baseLayers.standard || !baseLayers.satellite) {
        return;
      }
      const nextLayer = activeBaseLayer === "standard" ? "satellite" : "standard";
      leafletMap.removeLayer(baseLayers[activeBaseLayer]);
      baseLayers[nextLayer].addTo(leafletMap);
      activeBaseLayer = nextLayer;
      document.getElementById("toggleBaseLayer").textContent = activeBaseLayer === "standard" ? "卫星图层" : "标准地图";
      refreshLeafletMap();
    }

    function refreshLeafletMap() {
      if (!leafletMap) {
        return;
      }
      const refresh = () => {
        if (!leafletMap || !mapModal.classList.contains("show")) {
          return;
        }
        leafletMap.invalidateSize({pan: false});
      };
      requestAnimationFrame(refresh);
      [80, 240, 600].forEach((delay) => setTimeout(refresh, delay));
    }

    function setMapSelecting() {
      if (!patchSearchRegions.has(currentRegion)) {
        patchStatus.textContent = "请先选择已接入 patch 检索的区域。";
        return;
      }
      selectingMap = true;
      patchStatus.textContent = "";
    }

    function extractTimeRangeFromPrompt(text) {
      const value = String(text || "");
      const numeric = value.match(/(20\d{2})\s*年?\s*(1[0-2]|0?[1-9])\s*月/);
      if (numeric) {
        return `${numeric[1]}-${String(Number(numeric[2])).padStart(2, "0")}`;
      }
      const monthMap = {"一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9, "十": 10, "十一": 11, "十二": 12};
      const monthMatch = value.match(/(十一|十二|十|一|二|三|四|五|六|七|八|九)月/);
      if (!monthMatch) {
        return "";
      }
      const now = new Date();
      let year = now.getFullYear();
      if (value.includes("去年")) {
        year -= 1;
      }
      if (value.includes("前年")) {
        year -= 2;
      }
      return `${year}-${String(monthMap[monthMatch[1]]).padStart(2, "0")}`;
    }

    async function searchPatches(bbox) {
      if (!patchSearchRegions.has(currentRegion)) {
        patchStatus.textContent = "当前区域暂不支持地图定位 patch。";
        return;
      }
      const normalizedBbox = Array.isArray(bbox) && bbox.length === 4
        ? bbox.map((value) => Number(value))
        : null;
      if (!normalizedBbox || normalizedBbox.some((value) => !Number.isFinite(value))
          || normalizedBbox[0] >= normalizedBbox[2] || normalizedBbox[1] >= normalizedBbox[3]) {
        patchStatus.textContent = "请拖动出一个矩形范围后再检索 patch。";
        return;
      }
      if (patchSearchController) {
        patchSearchController.abort();
      }
      patchSearchController = new AbortController();
      const requestId = ++patchSearchRequestId;
      patchStatus.textContent = "正在检索候选 patch。";
      patchList.innerHTML = "";
      patchLayers.forEach((layer) => layer.remove());
      patchLayers = [];
      selectedPatchIds = [];
      selectedPatchRegion = "";
      confirmPatchSelection.disabled = true;
      try {
        const response = await fetch("/api/patches/search", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          signal: patchSearchController.signal,
          body: JSON.stringify({
            region: currentRegion,
            task: currentTask,
            time_range: extractTimeRangeFromPrompt(document.getElementById("prompt").value),
            bbox: normalizedBbox,
            limit: 12
          })
        });
        const payload = await response.json();
        if (requestId !== patchSearchRequestId) {
          return;
        }
        if (!response.ok) {
          throw new Error(payload.detail || payload.message || "patch 检索失败");
        }
        if (payload.status !== "ok") {
          patchStatus.textContent = payload.message || "当前范围没有可用 patch，请调整范围后重试。";
          return;
        }
        candidatePatches = payload.patches || [];
        renderPatchCandidates(payload.message || "");
      } catch (error) {
        if (error.name === "AbortError" || requestId !== patchSearchRequestId) {
          return;
        }
        patchStatus.textContent = `检索失败：${error.message || "未知错误"}`;
      }
    }

    function renderPatchCandidates(message = "") {
      if (!candidatePatches.length) {
        patchStatus.textContent = message || "当前范围没有找到可用 patch。";
        return;
      }
      // Framing a box selects ALL candidate patches inside it (capped at
      // maxPatchSelection); users can still click a tile to drop the ones they
      // don't want. This matches the intuition "framed 4 → analyse 4".
      selectedPatchIds = candidatePatches.slice(0, maxPatchSelection).map((patch) => patch.patch_id);
      selectedPatchRegion = currentRegion;
      confirmPatchSelection.disabled = false;
      const omitted = candidatePatches.length - selectedPatchIds.length;
      patchStatus.textContent = message || (
        `找到 ${candidatePatches.length} 个候选 patch，已选中 ${selectedPatchIds.length} 个` +
        (omitted > 0 ? `（超出上限 ${maxPatchSelection}，另 ${omitted} 个未选）` : "") +
        "，可点选取消不需要的 patch。"
      );
      patchList.innerHTML = candidatePatches.map((patch) => `
        <button class="patch-item ${selectedPatchIds.includes(patch.patch_id) ? "active" : ""}" data-patch-id="${escapeHtml(patch.patch_id)}" type="button">
          <strong>${escapeHtml(patch.patch_id)}</strong>
          <span>重叠分数：${escapeHtml(String(patch.score ?? "暂无"))}</span>
          <span>月份：${escapeHtml((patch.available_months || []).join(", ") || "暂无")}</span>
          <span>任务：${escapeHtml((patch.available_tasks || []).join(", ") || "实时推理")}</span>
        </button>
      `).join("");
      candidatePatches.forEach((patch) => {
        const bounds = patch.bounds_wgs84 || [];
        if (bounds.length !== 4) {
          return;
        }
        const layer = L.rectangle([[bounds[1], bounds[0]], [bounds[3], bounds[2]]], {
          color: selectedPatchIds.includes(patch.patch_id) ? "#2563eb" : "#16a34a",
          weight: selectedPatchIds.includes(patch.patch_id) ? 3 : 1,
          fillOpacity: selectedPatchIds.includes(patch.patch_id) ? 0.16 : 0.08
        }).addTo(leafletMap);
        layer.bindPopup(`${patch.patch_id}`);
        patchLayers.push(layer);
      });
    }

    function selectPatch(patchId) {
      const existing = selectedPatchIds.indexOf(patchId);
      if (existing >= 0) {
        selectedPatchIds.splice(existing, 1);
      } else {
        if (selectedPatchIds.length >= maxPatchSelection) {
          patchStatus.textContent = `最多同时选择 ${maxPatchSelection} 个 patch，请先取消一个再选择。`;
          return;
        }
        selectedPatchIds.push(patchId);
      }
      selectedPatchRegion = currentRegion;
      patchList.querySelectorAll(".patch-item").forEach((item) => {
        item.classList.toggle("active", selectedPatchIds.includes(item.dataset.patchId));
      });
      patchLayers.forEach((layer) => {
        const layerPatchId = layer.getPopup()?.getContent();
        const selected = selectedPatchIds.includes(layerPatchId);
        layer.setStyle({color: selected ? "#2563eb" : "#16a34a", weight: selected ? 3 : 1, fillOpacity: selected ? 0.16 : 0.08});
      });
      patchStatus.textContent = selectedPatchIds.length
        ? `已选择 ${selectedPatchIds.length} 个 patch，可继续调整。`
        : "尚未选择 patch，请至少选择一个。";
      confirmPatchSelection.disabled = !selectedPatchIds.length;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderReportCard(payload) {
      const report = payload.report;
      const analysis = payload.analysis;
      const stats = report.metrics.map((metric) => `
        <div class="stat">
          <span>${escapeHtml(metric.label)}</span>
          <strong>${escapeHtml(metric.value)}</strong>
        </div>
      `).join("");
      const figures = report.charts.map((chart) => `
        <figure class="report-figure">
          <img src="${escapeHtml(chart.url)}" alt="${escapeHtml(chart.title)}" />
          <figcaption>${escapeHtml(chart.caption)}</figcaption>
        </figure>
      `).join("");
      return `
        <div class="report-card">
          <h2>${escapeHtml(report.title)}</h2>
          <div class="intent-row">
            <span class="intent-pill">任务：${escapeHtml(payload.intent.task)}</span>
            <span class="intent-pill">地区：${escapeHtml(payload.intent.region)}</span>
            <span class="intent-pill">时间：${escapeHtml(payload.intent.time_range)}</span>
            <span class="intent-pill">意图来源：${escapeHtml(payload.intent.source)}</span>
            <span class="intent-pill">文案：${escapeHtml(report.llm_provider)}</span>
            <span class="intent-pill">数据：${escapeHtml(analysis.data_source === "prototype" ? "流程验证" : analysis.data_source)}</span>
            <span class="intent-pill">复用：${escapeHtml(report.reused ? "是" : "否")}</span>
          </div>
          <p>${escapeHtml(report.abstract)}</p>
          <div class="report-stats">${stats}</div>
          ${figures}
          <p>${escapeHtml(analysis.findings[0] || "")}</p>
          <p>${escapeHtml((analysis.narrative_blocks && analysis.narrative_blocks[0] && analysis.narrative_blocks[0].text) || "")}</p>
          <div class="report-links">
            <a href="${escapeHtml(report.html_url)}" data-preview-url="${escapeHtml(report.html_url)}" data-preview-type="html" data-preview-title="${escapeHtml(report.title)}">打开完整 HTML 报告</a>
            <a href="${escapeHtml(report.markdown_url)}" data-preview-url="${escapeHtml(report.markdown_url)}" data-preview-type="markdown" data-preview-title="${escapeHtml(report.title)}">查看 Markdown</a>
          </div>
        </div>
      `;
    }

    function inlineMarkdown(text) {
      return escapeHtml(text)
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" />')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function renderMarkdown(text) {
      const lines = text.replace(/\r\n/g, "\n").split("\n");
      const htmlParts = [];
      let listOpen = false;
      let codeOpen = false;
      let codeLines = [];

      function closeList() {
        if (listOpen) {
          htmlParts.push("</ul>");
          listOpen = false;
        }
      }

      function closeCode() {
        if (codeOpen) {
          htmlParts.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
          codeLines = [];
          codeOpen = false;
        }
      }

      lines.forEach((line) => {
        if (line.trim().startsWith("```")) {
          if (codeOpen) {
            closeCode();
          } else {
            closeList();
            codeOpen = true;
            codeLines = [];
          }
          return;
        }
        if (codeOpen) {
          codeLines.push(line);
          return;
        }
        if (!line.trim()) {
          closeList();
          return;
        }
        if (line.startsWith("# ")) {
          closeList();
          htmlParts.push(`<h1>${inlineMarkdown(line.slice(2).trim())}</h1>`);
          return;
        }
        if (line.startsWith("## ")) {
          closeList();
          htmlParts.push(`<h2>${inlineMarkdown(line.slice(3).trim())}</h2>`);
          return;
        }
        if (line.startsWith("### ")) {
          closeList();
          htmlParts.push(`<h3>${inlineMarkdown(line.slice(4).trim())}</h3>`);
          return;
        }
        if (line.startsWith("- ")) {
          if (!listOpen) {
            htmlParts.push("<ul>");
            listOpen = true;
          }
          htmlParts.push(`<li>${inlineMarkdown(line.slice(2).trim())}</li>`);
          return;
        }
        closeList();
        htmlParts.push(`<p>${inlineMarkdown(line.trim())}</p>`);
      });
      closeCode();
      closeList();
      return htmlParts.join("");
    }

    function showMarkdownPreview(rawMode) {
      if (!currentMarkdownPreview) {
        return;
      }
      currentMarkdownPreview.raw = rawMode;
      previewMeta.textContent = rawMode ? "Markdown 原文" : "Markdown 预览";
      toggleMarkdownRaw.textContent = rawMode ? "预览" : "原文";
      if (rawMode) {
        previewBody.innerHTML = `<pre class="markdown-preview raw">${escapeHtml(currentMarkdownPreview.text)}</pre>`;
      } else {
        previewBody.innerHTML = `<article class="markdown-preview">${renderMarkdown(currentMarkdownPreview.text)}</article>`;
      }
    }

    async function openPreview(url, type, title) {
      app.classList.add("preview-open");
      previewTitle.textContent = title || "报告预览";
      previewMeta.textContent = type === "markdown" ? "Markdown 预览" : "HTML";
      previewOpenRaw.href = url;
      previewBody.innerHTML = '<div class="preview-empty">正在加载报告内容。</div>';
      currentMarkdownPreview = null;
      toggleMarkdownRaw.style.display = type === "markdown" ? "inline-grid" : "none";
      if (type === "markdown") {
        try {
          const response = await fetch(url);
          const text = await response.text();
          currentMarkdownPreview = {url, title, text, raw: false};
          showMarkdownPreview(false);
        } catch (error) {
          previewBody.innerHTML = `<div class="preview-empty">Markdown 加载失败：${escapeHtml(error.message || "未知错误")}</div>`;
        }
        return;
      }
      previewBody.innerHTML = `<iframe class="preview-frame" src="${escapeHtml(url)}" title="${escapeHtml(title || "报告预览")}"></iframe>`;
    }

    function closePreview() {
      app.classList.remove("preview-open");
      previewBody.innerHTML = '<div class="preview-empty">点击报告链接后在这里查看内容。</div>';
      previewOpenRaw.href = "#";
      toggleMarkdownRaw.style.display = "none";
      currentMarkdownPreview = null;
    }

    function updateMemoryStrip(payload) {
      const memory = payload.memory || {};
      const intent = payload.intent || memory.current_intent || {};
      const slots = memory.pending_slots || [];
      const reports = memory.reports || [];
      document.getElementById("memoryStrip").innerHTML = `
        <span>会话：${escapeHtml((payload.session_id || sessionId).slice(0, 18))}</span>
        <span>状态：${escapeHtml(payload.status || memory.mode || "idle")}</span>
        <span>任务：${escapeHtml(intent.task || currentTask)}</span>
        <span>地区：${escapeHtml(intent.region || currentRegion)}</span>
        <span>时间：${escapeHtml(intent.time_range || "待补充")}</span>
        <span>缺失：${escapeHtml(slots.length ? slots.join(", ") : "无")}</span>
        <span>历史报告：${escapeHtml(String(reports.length || 0))}</span>
      `;
    }

    function renderAnnotation(payload) {
      const action = payload.action || {};
      const url = action.url || "";
      const className = action.class_name || "该地物";
      const cta = url
        ? `<a class="anno-cta" href="${escapeHtml(url)}" target="_blank" rel="noopener">前往标注 <span class="anno-arrow">→</span></a>`
        : `<div class="anno-hint">暂未拿到标注入口，请稍后重试。</div>`;
      return `
        <div class="annotation-card">
          <div class="anno-head"><span class="anno-icon">🖊️</span><span>「${escapeHtml(className)}」需要先标注</span></div>
          <p>${escapeHtml(payload.message || `『${className}』不是内置地物，需要先标注少量样本再训练。`)}</p>
          ${cta}
        </div>
      `;
    }

    function renderClarification(payload) {
      return `
        <div class="report-card">
          <p>${escapeHtml(payload.message || "请补充关键信息。")}</p>
          <div class="intent-row">
            <span class="intent-pill">任务：${escapeHtml(payload.intent?.task || currentTask)}</span>
            <span class="intent-pill">地区：${escapeHtml(payload.intent?.region || currentRegion)}</span>
            <span class="intent-pill">时间：${escapeHtml(payload.intent?.time_range || "待补充")}</span>
            <span class="intent-pill">缺失：${escapeHtml((payload.intent?.missing_fields || []).join(", ") || "未知")}</span>
          </div>
        </div>
      `;
    }

    async function sendMessage() {
      const prompt = document.getElementById("prompt").value.trim();
      const sendButton = document.getElementById("send");
      if (!prompt) {
        return;
      }
      sendButton.disabled = true;
      addMessage(prompt, "user");
      addMessage("正在理解你的意图并更新会话状态。", "agent");
      try {
        const requestRegion = selectedPatchIds.length && selectedPatchRegion ? selectedPatchRegion : currentRegion;
        const response = await fetch("/api/report", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            session_id: sessionId,
            task: currentTask,
            region: requestRegion,
            prompt: prompt,
            selected_patch_ids: selectedPatchIds,
            aoi: selectedAoi || {}
          })
        });
        const payload = await response.json();
        updateMemoryStrip(payload);
        refreshSessions();
        if (!response.ok || payload.status !== "ok") {
          if (payload.status === "needs_input") {
            messages.removeChild(messages.lastElementChild);
            addMessage(renderClarification(payload), "agent");
            return;
          }
          if (payload.status === "chat") {
            messages.removeChild(messages.lastElementChild);
            addMessage(`<p>${escapeHtml(payload.message || "我在。")}</p>`, "agent");
            return;
          }
          if (payload.status === "needs_annotation") {
            messages.removeChild(messages.lastElementChild);
            addMessage(renderAnnotation(payload), "agent");
            return;
          }
          throw new Error(payload.detail || payload.error || payload.message || "报告生成失败");
        }
        messages.removeChild(messages.lastElementChild);
        addMessage(renderReportCard(payload), "agent");
        refreshSessions();
      } catch (error) {
        messages.removeChild(messages.lastElementChild);
        addMessage(`
          <div class="report-card">
            <p>请求失败：${escapeHtml(error.message || "请检查后端服务是否在线。")}</p>
          </div>
        `, "agent");
      } finally {
        sendButton.disabled = false;
        document.getElementById("prompt").value = "";
        document.getElementById("prompt").focus();
      }
    }

    async function resetSession() {
      await fetch("/api/session/reset", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId})
      });
      messages.innerHTML = '<div class="msg agent">会话已清空。直接说出你想分析什么就行，也可以先和我聊聊。</div>';
      updateMemoryStrip({status: "idle", session_id: sessionId, memory: {pending_slots: []}});
      closePreview();
      refreshSessions();
    }

    sessionList.addEventListener("click", (event) => {
      const item = event.target.closest(".session-item");
      if (!item) {
        return;
      }
      loadSession(item.dataset.sessionId);
    });

    taskTags.addEventListener("click", (event) => {
      const tag = event.target.closest(".tag");
      if (!tag || tag.disabled || !tag.dataset.task) {
        return;
      }
      // Toggle: click the active tag again to deselect it.
      currentTask = currentTask === tag.dataset.task ? "" : tag.dataset.task;
      renderTaskTags(currentTask);
      clearPatchSelection();
      updateMapLabel();
    });

    openMap.addEventListener("click", () => {
      mapModal.classList.add("show");
      initLeafletMap();
      updateMapLabel();
      refreshLeafletMap();
    });

    document.getElementById("closeMap").addEventListener("click", () => {
      mapModal.classList.remove("show");
    });

    document.getElementById("startMapSelect").addEventListener("click", setMapSelecting);

    document.getElementById("toggleBaseLayer").addEventListener("click", toggleBaseLayer);

    patchList.addEventListener("click", (event) => {
      const item = event.target.closest(".patch-item");
      if (!item) {
        return;
      }
      selectPatch(item.dataset.patchId);
    });

    confirmPatchSelection.addEventListener("click", () => {
      if (!selectedPatchIds.length) {
        return;
      }
      updateMapLabel();
      mapModal.classList.remove("show");
      const selectionText = selectedPatchIds.length === 1
        ? escapeHtml(selectedPatchIds[0])
        : `${selectedPatchIds.length} 个 patch`;
      addMessage(`已选择 ${escapeHtml(currentRegion)} 的 ${selectionText}，后续报告会按所选范围生成合计结果。`, "agent");
    });

    mapModal.addEventListener("click", (event) => {
      if (event.target === mapModal) {
        mapModal.classList.remove("show");
      }
    });

    document.querySelectorAll(".region").forEach((region) => {
      region.addEventListener("click", () => {
        document.querySelectorAll(".region").forEach((item) => item.classList.remove("active"));
        region.classList.add("active");
        currentRegion = region.dataset.region;
        clearPatchSelection();
        renderTaskTags();
        updateMapLabel();
      });
    });

    document.querySelectorAll(".suggestion").forEach((button) => {
      button.addEventListener("click", () => {
        // Fill the input and let the user review/edit, then send manually.
        const input = document.getElementById("prompt");
        input.value = button.dataset.prompt;
        input.focus();
      });
    });

    messages.addEventListener("click", (event) => {
      const previewLink = event.target.closest("[data-preview-url]");
      if (previewLink) {
        event.preventDefault();
        openPreview(previewLink.dataset.previewUrl, previewLink.dataset.previewType, previewLink.dataset.previewTitle);
        return;
      }
    });

    toggleMarkdownRaw.addEventListener("click", () => {
      if (!currentMarkdownPreview) {
        return;
      }
      showMarkdownPreview(!currentMarkdownPreview.raw);
    });
    document.getElementById("closePreview").addEventListener("click", closePreview);
    document.getElementById("newSession").addEventListener("click", newSession);
    document.getElementById("resetSession").addEventListener("click", resetSession);
    document.getElementById("send").addEventListener("click", sendMessage);
    document.getElementById("prompt").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    renderTaskTags(currentTask);
    updateMapLabel();
    updateMemoryStrip({status: "idle", session_id: sessionId, memory: {pending_slots: []}});
    refreshSessions();
  </script>
</body>
</html>
